  <path d="M 318 380 Q 270 365 240 380 Q 265 375 285 365" stroke="#7D6740" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 318 440 Q 280 428 255 440 Q 275 435 290 425" stroke="#7D6740" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Opposite right leaves -->
  <path d="M 322 320 Q 360 310 380 325 Q 365 320 355 310" stroke="#7D6740" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 322 380 Q 370 365 400 380 Q 375 375 355 365" stroke="#7D6740" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 322 440 Q 360 428 385 440 Q 365 435 350 425" stroke="#7D6740" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Shaggy whorled crown of tubular petals -->
  <g>
    <!-- Upper tier -->
    <path d="M 320 240 Q 310 210 305 190" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 320 240 Q 330 210 335 190" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 320 240 Q 295 205 275 180" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 320 240 Q 345 205 365 180" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 320 240 Q 320 205 315 175" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Lower tier -->
    <path d="M 318 255 Q 305 225 295 200" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 322 255 Q 335 225 345 200" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 315 260 Q 280 230 260 205" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 325 260 Q 360 230 380 205" stroke="#6C5A3A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Crown center fill -->
    <circle cx="320" cy="230" r="18" fill="#D3BF98" fill-opacity="0.45" stroke="#6C5A3A" stroke-width="2"/>
  </g>

  <!-- Annotation leaders and labels -->
  <line x1="320" y1="230" x2="420" y2="180" stroke="#A78545" stroke-width="3"/>
  <text x="425" y="190" font-family="serif" font-size="24" fill="#7D6740">whorled crown</text>

  <line x1="320" y1="360" x2="520" y2="340" stroke="#A78545" stroke-width="3"/>
  <text x="525" y="350" font-family="serif" font-size="24" fill="#7D6740">square stem</text>

  <!-- Caption zone -->
  <path d="M120 598H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M120 640H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="60" y="690" fill="#6C5A3A" font-family="serif" font-size="32">Monarda didyma</text>
  <text x="60" y="726" fill="#7D6740" font-family="serif" font-size="24">Plate 116 · Bee balm study</text>
</svg>