  <path d="M120 598H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M120 640H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Latin name -->
  <text x="60" y="690" fill="#6C5A3A" font-family="serif" font-size="32">Borago officinalis</text>

  <!-- Plate line -->
  <text x="60" y="726" fill="#7D6740" font-family="serif" font-size="24">Plate 115 · Borage study</text>

  <!-- Annotation 1: star flower -->
  <line x1="320" y1="145" x2="420" y2="110" stroke="#A78545" stroke-width="3"/>
  <text x="420" y="130" font-family="serif" font-size="24" fill="#7D6740">star flower</text>

  <!-- Annotation 2: bristled stem -->
  <line x1="315" y1="400" x2="450" y2="420" stroke="#A78545" stroke-width="3"/>
