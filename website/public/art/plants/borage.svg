  <path d="M 340 200 Q 342 190 340 180" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.3"/>
  <path d="M 332 215 Q 325 220 320 225" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.3"/>
  <path d="M 348 215 Q 355 220 360 225" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.3"/>

  <!-- Small nodding flower below center -->
  <circle cx="320" cy="235" r="3" stroke="#7D6740" stroke-width="2" fill="#D8C49C" fill-opacity="0.4"/>
  <path d="M 320 225 L 320 220" stroke="#7D6740" stroke-width="2.5"/>

