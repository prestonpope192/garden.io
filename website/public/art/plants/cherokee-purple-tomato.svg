  <!-- short stem on calyx -->
  <path d="M 412 438 C 412 433 413 428 414 424" stroke="#6C5A3A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- highlight curve -->
  <path d="M 388 470 C 390 462 397 458 404 462" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>

