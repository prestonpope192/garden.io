  <text x="572" y="445" font-family="serif" font-size="24" fill="#7D6740" text-anchor="end">ribbed shoulder</text>

  <!-- Annotation 2: compound leaf (left) -->
  <line x1="245" y1="395" x2="170" y2="368" stroke="#A78545" stroke-width="3"/>
  <text x="64" y="372" font-family="serif" font-size="24" fill="#7D6740">compound leaf</text>

  <!-- Caption dividers -->
  <path d="M120 598H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M120 640H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Latin name -->
  <text x="60" y="685" fill="#6C5A3A" font-family="serif" font-size="26">Solanum lycopersicum 'Cherokee Purple'</text>

  <!-- Plate line -->
  <text x="60" y="726" fill="#7D6740" font-family="serif" font-size="24">Plate 109 · Cherokee Purple Tomato</text>
