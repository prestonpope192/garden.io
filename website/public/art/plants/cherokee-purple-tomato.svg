  <!-- ribbing curves over shoulder -->
  <path d="M 396 450 C 394 458 394 466 397 474" stroke="#7D6740" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 406 447 C 404 456 404 464 406 472" stroke="#7D6740" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 416 447 C 415 456 415 464 417 472" stroke="#7D6740" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 427 450 C 426 458 427 466 430 473" stroke="#7D6740" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- calyx 5 sepals -->
