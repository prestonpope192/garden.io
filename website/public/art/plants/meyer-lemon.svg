  <path d="M 440 285 C 428 268 430 248 444 238 C 458 228 476 234 476 250 C 476 266 463 284 448 290 C 442 293 441 290 440 285 Z" stroke="#7D6740" stroke-width="3" fill="#D3BF98" fill-opacity="0.38"/>
