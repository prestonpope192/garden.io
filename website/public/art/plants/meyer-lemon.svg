  <!-- 5 petals -->
  <ellipse cx="450" cy="270" rx="10" ry="6" stroke="#7D6740" stroke-width="2" fill="#D3BF98" fill-opacity="0.35" transform="rotate(-70 450 270)"/>
  <ellipse cx="460" cy="262" rx="10" ry="6" stroke="#7D6740" stroke-width="2" fill="#D3BF98" fill-opacity="0.35" transform="rotate(-30 460 262)"/>
  <ellipse cx="466" cy="272" rx="10" ry="6" stroke="#7D6740" stroke-width="2" fill="#D3BF98" fill-opacity="0.35" transform="rotate(20 466 272)"/>
  <ellipse cx="460" cy="282" rx="10" ry="6" stroke="#7D6740" stroke-width="2" fill="#D3BF98" fill-opacity="0.35" transform="rotate(60 460 282)"/>
  <ellipse cx="450" cy="280" rx="10" ry="6" stroke="#7D6740" stroke-width="2" fill="#D3BF98" fill-opacity="0.35" transform="rotate(-110 450 280)"/>
  <!-- center dot -->
  <circle cx="456" cy="273" r="4" stroke="#7D6740" stroke-width="2" fill="#D8C49C" fill-opacity="0.55"/>
  <!-- bud 1 -->
  <path d="M 468 256 C 465 248 466 238 470 234 C 474 230 478 232 479 238 C 480 244 477 252 472 256 C 470 258 469 258 468 256 Z" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.40"/>
  <!-- bud 2 -->
  <path d="M 480 262 C 477 254 479 243 483 240 C 487 237 490 240 491 246 C 492 252 489 260 484 264 C 482 266 481 265 480 262 Z" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.40"/>

  <!-- Annotation 1: fragrant blossom (right, anchor end) -->
  <line x1="472" y1="266" x2="534" y2="240" stroke="#A78545" stroke-width="3"/>
  <text x="572" y="244" font-family="serif" font-size="24" fill="#7D6740" text-anchor="end">fragrant blossom</text>

  <!-- Annotation 2: thin-skinned fruit (left) -->
  <line x1="280" y1="476" x2="198" y2="500" stroke="#A78545" stroke-width="3"/>
  <text x="64" y="504" font-family="serif" font-size="24" fill="#7D6740">thin-skinned fruit</text>

  <!-- Caption dividers -->
  <path d="M120 598H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M120 640H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Latin name -->
  <text x="60" y="690" fill="#6C5A3A" font-family="serif" font-size="32">Citrus × meyeri</text>

  <!-- Plate line -->
  <text x="60" y="726" fill="#7D6740" font-family="serif" font-size="24">Plate 107 · Meyer Lemon study</text>
</svg>
