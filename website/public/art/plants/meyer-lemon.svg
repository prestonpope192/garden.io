  <path d="M 404 338 C 400 320 400 310 402 305" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 400 350 L 390 346 M 400 350 L 411 343" stroke="#7D6740" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 395 360 L 385 357 M 395 360 L 405 354" stroke="#7D6740" stroke-width="1.2" fill="none" stroke-linecap="round"/>

