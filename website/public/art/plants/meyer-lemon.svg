  <path d="M 236 380 C 232 364 232 352 234 346" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 233 392 L 222 388 M 233 392 L 243 385" stroke="#7D6740" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 230 403 L 220 400 M 230 403 L 240 397" stroke="#7D6740" stroke-width="1.2" fill="none" stroke-linecap="round"/>

