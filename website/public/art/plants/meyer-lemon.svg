  <ellipse cx="318" cy="476" rx="42" ry="35" stroke="#6C5A3A" stroke-width="4" fill="#D3BF98" fill-opacity="0.48"/>
  <!-- Inner layer -->
  <ellipse cx="316" cy="474" rx="32" ry="26" stroke="none" fill="#D8C49C" fill-opacity="0.34"/>
