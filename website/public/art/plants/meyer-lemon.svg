  <path d="M 420 305 L 432 272" stroke="#7D6740" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 432 272 C 428 254 428 244 430 238" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 428 286 L 417 282 M 428 286 L 439 278" stroke="#7D6740" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 423 296 L 412 293 M 423 296 L 434 289" stroke="#7D6740" stroke-width="1.2" fill="none" stroke-linecap="round"/>

