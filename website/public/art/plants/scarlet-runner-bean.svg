  <text x="572" y="232" font-family="serif" font-size="24" fill="#7D6740" text-anchor="end">twining stem</text>

  <!-- Caption dividers -->
  <path d="M120 598H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M120 640H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Latin name -->
  <text x="60" y="690" fill="#6C5A3A" font-family="serif" font-size="32">Phaseolus coccineus</text>

  <!-- Plate line -->
  <text x="60" y="726" fill="#7D6740" font-family="serif" font-size="24">Plate 111 · Scarlet Runner Bean</text>
</svg>
