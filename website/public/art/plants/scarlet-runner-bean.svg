  <ellipse cx="389" cy="478" rx="6" ry="5" stroke="#7D6740" stroke-width="1.5" fill="none"/>
  <ellipse cx="390" cy="493" rx="6" ry="5" stroke="#7D6740" stroke-width="1.5" fill="none"/>
  <ellipse cx="392" cy="508" rx="6" ry="5" stroke="#7D6740" stroke-width="1.5" fill="none"/>

  <!-- Annotation 1: flower raceme (left) -->
  <line x1="196" y1="200" x2="148" y2="174" stroke="#A78545" stroke-width="3"/>
