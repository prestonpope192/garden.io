  <path d="M 198 206 C 207 200 210 192 206 186 C 202 180 194 180 190 186 C 186 192 188 200 198 206 Z" stroke="#7D6740" stroke-width="2" fill="#D8C49C" fill-opacity="0.38"/>
  <path d="M 197 193 C 188 188 186 180 190 174 C 194 168 202 168 206 174 C 210 180 208 188 197 193 Z" stroke="#7D6740" stroke-width="2" fill="#D3BF98" fill-opacity="0.42"/>
