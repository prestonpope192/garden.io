  <path d="M 418 362 C 434 348 440 330 432 316 C 424 302 408 298 396 308 C 384 318 380 336 388 350 C 394 360 408 366 418 362 Z" stroke="#7D6740" stroke-width="3" fill="#D8C49C" fill-opacity="0.42"/>
