  <ellipse cx="370" cy="476" rx="6" ry="5" stroke="#7D6740" stroke-width="1.5" fill="none"/>
  <ellipse cx="370" cy="490" rx="6" ry="5" stroke="#7D6740" stroke-width="1.5" fill="none"/>
