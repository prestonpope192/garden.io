  <text x="60" y="690" fill="#6C5A3A" font-family="serif" font-size="32">Allium sativum var. ophioscorodon</text>
  <text x="60" y="726" fill="#7D6740" font-family="serif" font-size="24">Plate 119 · Garlic hardneck study</text>
