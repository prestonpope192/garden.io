  <circle cx="368" cy="80" r="5" fill="#D3BF98" fill-opacity="0.4" stroke="#6C5A3A" stroke-width="1.5"/>
  <circle cx="365" cy="90" r="5" fill="#D3BF98" fill-opacity="0.4" stroke="#6C5A3A" stroke-width="1.5"/>

