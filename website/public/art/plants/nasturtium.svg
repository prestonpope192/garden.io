  <path d="M 180 468 L 228 408" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 180 468 L 230 438" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 180 468 L 152 388" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 180 468 L 210 390" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>

