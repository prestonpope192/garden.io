  <path d="M 358 462 L 342 402" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 358 462 L 374 402" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>

