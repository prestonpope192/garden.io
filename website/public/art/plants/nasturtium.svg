  <path d="M 276 464 L 312 440" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 276 464 L 258 396" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 276 464 L 295 396" stroke="#7D6740" stroke-width="1.5" fill="none" stroke-linecap="round"/>

