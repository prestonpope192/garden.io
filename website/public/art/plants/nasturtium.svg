  <path d="M 482 388 C 478 372 480 352 490 340 C 500 328 514 328 516 342 C 518 356 506 374 490 382 C 487 384 484 388 482 388 Z" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.40"/>
  <!-- petal 2 upper-right -->
  <path d="M 482 388 C 492 374 506 362 520 358 C 534 354 544 362 540 376 C 536 390 520 396 504 394 C 494 392 484 390 482 388 Z" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.38"/>
  <!-- petal 3 right -->
  <path d="M 482 388 C 496 382 512 382 522 392 C 532 402 528 418 514 422 C 500 426 486 416 482 404 C 481 398 481 392 482 388 Z" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.36"/>
  <!-- petal 4 lower-left -->
  <path d="M 482 388 C 474 398 464 408 450 408 C 436 408 428 398 434 386 C 440 374 458 370 472 378 C 478 382 482 386 482 388 Z" stroke="#7D6740" stroke-width="2.5" fill="#D8C49C" fill-opacity="0.38"/>
  <!-- petal 5 upper-left -->
  <path d="M 482 388 C 470 378 462 362 466 348 C 470 334 484 328 494 336 C 504 344 506 362 498 376 C 493 384 487 388 482 388 Z" stroke="#7D6740" stroke-width="2.5" fill="#D8C49C" fill-opacity="0.36"/>
  <!-- spur extending behind/below: curved tapering -->
  <path d="M 482 388 C 472 396 456 404 440 406 C 424 408 408 400 406 390" stroke="#6C5A3A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 406 390 C 400 380 402 368 410 366" stroke="#6C5A3A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- throat center -->
  <circle cx="482" cy="388" r="5" stroke="#7D6740" stroke-width="2" fill="#D8C49C" fill-opacity="0.55"/>

  <!-- Closed bud on a stalk -->
  <path d="M 460 450 C 464 436 470 422 474 410" stroke="#6C5A3A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 474 410 C 472 402 474 392 480 386 C 486 380 492 380 494 388 C 496 396 492 408 482 414 C 478 416 475 414 474 410 Z" stroke="#7D6740" stroke-width="2.5" fill="#D3BF98" fill-opacity="0.44"/>

  <!-- Annotation 1: peltate leaf (left) -->
  <line x1="143" y1="430" x2="100" y2="400" stroke="#A78545" stroke-width="3"/>
  <text x="64" y="404" font-family="serif" font-size="24" fill="#7D6740">peltate leaf</text>

  <!-- Annotation 2: nectar spur (right, anchor end) -->
  <line x1="410" y1="385" x2="354" y2="344" stroke="#A78545" stroke-width="3"/>
  <text x="572" y="332" font-family="serif" font-size="24" fill="#7D6740" text-anchor="end">nectar spur</text>

  <!-- Caption dividers -->
  <path d="M120 598H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M120 640H520" stroke="#C7B38A" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Latin name -->
  <text x="60" y="690" fill="#6C5A3A" font-family="serif" font-size="32">Tropaeolum majus</text>

  <!-- Plate line -->
  <text x="60" y="726" fill="#7D6740" font-family="serif" font-size="24">Plate 114 · Nasturtium study</text>
</svg>
